services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xray}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xray}
      POSTGRES_DB: ${POSTGRES_DB:-xray}
    ports:
      # Для локальной разработки: приложение из `npm run start:dev` ходит на localhost
      - '127.0.0.1:${DB_PORT:-5478}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-xray}:${POSTGRES_PASSWORD:-xray}@db:5432/${POSTGRES_DB:-xray}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${PORT:-3000}:3000'
    restart: unless-stopped

volumes:
  db-data:
